# Local stack. Secrets come from .env (git-ignored); create it once with:
#   pwsh -File scripts/init-env.ps1
#
#   Whole stack:       docker compose up -d --build
#   Infra only:        docker compose up -d redis   (then run the .NET hosts with `dotnet run`)
#   With OpenSearch:   add --profile search          (~1 GB RAM)
#
# Postgres is NOT a container: it runs on this machine by default, or on any other server (with PostGIS
# installed). The api creates the database and applies the EF Core migrations on startup (code-first).
# The app containers reach it at POSTGRES_HOST_FROM_DOCKER: host.docker.internal (this machine) by
# default, or another server's name or IP.
# Only the integration tests run Postgres in Docker (Testcontainers).
#
# Ports: web 3000 · api 5080 · realtime 5081 · redis 6379 · opensearch 9200 (host Postgres: 5432)
name: marketplace

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Development
  DOTNET_ENVIRONMENT: Development
  ConnectionStrings__Postgres: Host=${POSTGRES_HOST_FROM_DOCKER:-host.docker.internal};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-marketplace};Username=${POSTGRES_USER:-marketplace};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run scripts/init-env.ps1)}
  ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (run scripts/init-env.ps1)}
  Auth__SigningKey: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY in .env (run scripts/init-env.ps1)}
  Auth__DevTokens: "true"

# Docker Desktop defines host.docker.internal already; this makes it work on Linux engines too.
x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  # ---- Applications ---------------------------------------------------------

  api:
    build:
      context: .
      args:
        PROJECT: Marketplace.Api
    image: marketplace/api:dev
    labels:
      com.microsoft.visual-studio.project-name: Marketplace.Api   # VS maps this service to its project (all hosts share one Dockerfile)
    environment:
      <<: *dotnet-env
      Database__MigrateOnStartup: "true"
      Cors__Origins__0: http://localhost:3000
    ports:
      - "5080:8080"
    extra_hosts: *host-gateway
    restart: unless-stopped   # retries until the host's Postgres accepts connections

  realtime:
    build:
      context: .
      args:
        PROJECT: Marketplace.Realtime
    image: marketplace/realtime:dev
    labels:
      com.microsoft.visual-studio.project-name: Marketplace.Realtime
    environment:
      <<: *dotnet-env
      Cors__Origins__0: http://localhost:3000
    ports:
      - "5081:8080"
    extra_hosts: *host-gateway
    depends_on:
      redis:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        PROJECT: Marketplace.Worker
    image: marketplace/worker:dev
    labels:
      com.microsoft.visual-studio.project-name: Marketplace.Worker
    environment:
      <<: *dotnet-env
    extra_hosts: *host-gateway
    depends_on:
      redis:
        condition: service_started
      api:
        condition: service_started   # api applies migrations first
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: marketplace/web:dev
    environment:
      API_URL: http://api:8080                       # server-side calls go over the compose network
      REALTIME_PUBLIC_URL: http://localhost:5081     # the browser connects to realtime directly
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # ---- Infrastructure -------------------------------------------------------

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (run scripts/init-env.ps1)}"]
    ports:
      - "6379:6379"

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data

volumes:
  osdata:
